<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Family Rig-C Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, ui-monospace, monospace;
      background: #14161a; color: #e6edf3;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      flex: 0 0 auto; padding: 12px 16px 10px; z-index: 10;
      background: #1b1e25; border-bottom: 1px solid #343945;
      font-size: 12px; max-height: 44dvh; overflow-y: auto;
      scrollbar-width: thin;
    }
    .masthead { display: flex; align-items: center; gap: 16px; min-width: 0; margin-bottom: 10px; }
    h1 { flex: 0 0 auto; font-size: 14px; font-weight: 700; color: #fff; line-height: 1.4; }
    h1 span { display: block; color: #8d98aa; font-weight: 400; font-size: 10px; letter-spacing: .03em; }
    .scene-control { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .scene-control > span { flex: 0 0 auto; color: #a6afbf; }
    #charSelect { width: 330px; max-width: 100%; min-width: 0; }
    #stats { flex: 1; min-width: 0; font-size: 11px; line-height: 1.5; color: #8fd3a0; overflow-wrap: anywhere; }
    #resetBtn { flex: 0 0 auto; color: #a6afbf; background: transparent; border-color: #343945; }
    .toolbar-groups { display: grid; grid-template-columns: minmax(185px, .8fr) minmax(400px, 1.8fr) minmax(230px, 1fr); gap: 8px; }
    .tool-panel { min-width: 0; padding: 9px 10px; border: 1px solid #303641; border-radius: 8px; background: #20242c; }
    .tool-panel h2 { margin-bottom: 7px; color: #98a5b9; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
    .panel-controls, .control-set { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
    .panel-controls { row-gap: 8px; }
    .control-set { max-width: 100%; }
    .control-set + .control-set { padding-left: 10px; margin-left: 4px; border-left: 1px solid #3a414e; }
    .control-name { color: #a6afbf; font-size: 11px; white-space: nowrap; }
    .value { min-width: 29px; color: #e6edf3; font-variant-numeric: tabular-nums; text-align: right; }
    label { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; color: #a6afbf; }
    button, select {
      background: #292f3a; color: #d5d9e0; border: 1px solid #3b4454;
      border-radius: 5px; padding: 5px 8px; min-height: 29px; font: inherit; font-size: 12px;
      cursor: pointer;
    }
    button { white-space: nowrap; }
    button:hover, select:hover { background: #354053; border-color: #58677e; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #f47296; outline-offset: 3px; }
    button.on { background: #782a44; border-color: #d4597e; color: #fff; }
    #pauseBtn { min-width: 72px; }
    input[type="range"] { width: 80px; min-width: 0; accent-color: #e85a82; cursor: pointer; }
    #wind { width: 110px; }
    input[type="number"] { width: 57px; min-height: 29px; color: #e6edf3; background: #171b22; border: 1px solid #3b4454; border-radius: 5px; padding: 4px 5px; font: inherit; font-variant-numeric: tabular-nums; }
    .physics-panel { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
    .physics-panel h2 { flex: 0 0 auto; margin: 0; }
    .physics-panel h2 span { display: block; margin-top: 3px; font-size: 10px; font-weight: 400; letter-spacing: 0; color: #7f8b9d; }
    .physics-panel .panel-controls { flex: 1; column-gap: 14px; }
    .physics-panel .control-set + .control-set { margin-left: 0; padding-left: 14px; }
    .wind-readout { display: inline-flex; align-items: center; gap: 5px; color: #a6afbf; font-size: 11px; }
    #windCurrent { min-width: 36px; color: #a4dfb2; }
    #pulseBtn { min-width: 94px; }
    #pulseBtn:disabled { cursor: default; opacity: .7; }
    .view-controls { column-gap: 10px; }
    .background-controls { gap: 4px; }
    .background-controls button { padding-inline: 7px; }
    .diagnostic-controls { gap: 7px; }
    .diagnostic-controls label { font-size: 11px; }
    #meshOpacity { width: 70px; }
    #viewport {
      position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden;
    }
    #stage {
      position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; cursor: grab; touch-action: none;
    }
    #stage:active { cursor: grabbing; }
    .bg-dark { background: radial-gradient(circle at 50% 45%, #222631 0%, #12141a 100%); }
    .bg-grey { background: #808080; }
    .bg-white { background: #ffffff; }
    .bg-magenta { background: #ff00ff; }
    #ref-pane { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden;
      border-left: 1px solid #2a2e37; display: none; touch-action: none; cursor: grab; }
    #ref-pane.show { display: block; }
    #refImg { position: absolute; max-width: none; max-height: none; pointer-events: none; }
    #ref-pane .cap { position: absolute; left: 10px; top: 10px; z-index: 2; font-size: 12px;
      color: #d5d9e0; padding: 4px 8px; background: #181b22bb; pointer-events: none; }
    #overlay, #refOverlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }
    #bustEditorBar {
      display: none; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px;
      padding: 8px 12px; border-radius: 8px; background: #141821; border: 1px solid #2e3646; font-size: 12px;
    }
    #bustEditorBar.show { display: flex; }
    #bustEditorBar .bust-group { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid #2a303c; }
    #bustEditorBar .bust-tag-r { color: #00e5ff; font-weight: 700; }
    #bustEditorBar .bust-tag-l { color: #52ff88; font-weight: 700; }
    #bustEditorBar input[type="number"] { width: 52px; padding: 2px 4px; background: #1d222e; color: #eef2f9; border: 1px solid #363e4f; border-radius: 4px; font-size: 12px; }
    #bustApplyBtn { background: #1f6feb; border-color: #388bfd; color: #fff; font-weight: 600; }
    #bustApplyBtn:disabled { opacity: 0.6; cursor: wait; }
    @media (max-width: 1100px) {
      header { padding: 10px; }
      .masthead { gap: 10px; flex-wrap: wrap; }
      #stats { flex-basis: 200px; }
      .toolbar-groups { grid-template-columns: minmax(0, .8fr) minmax(0, 1.7fr) minmax(0, 1fr); }
      .control-set + .control-set { padding-left: 0; margin-left: 0; border-left: 0; }
      .physics-panel .control-set + .control-set { padding-left: 0; }
    }
    @media (max-width: 760px) {
      header { max-height: 46dvh; padding: 10px 8px; }
      .masthead { gap: 8px 12px; }
      h1 { flex: 1; }
      #resetBtn { order: 1; }
      .scene-control { order: 2; flex: 1 1 100%; }
      #charSelect { flex: 1; width: 0; }
      #stats { order: 3; flex-basis: 100%; }
      .toolbar-groups { grid-template-columns: 1fr; gap: 6px; }
      .tool-panel { display: flex; align-items: center; gap: 10px; padding: 8px; }
      .tool-panel h2 { flex: 0 0 28px; margin: 0; }
      .panel-controls { flex: 1; }
      .physics-panel { align-items: flex-start; }
      .physics-panel h2 { flex-basis: 28px; line-height: 1.5; padding-top: 3px; }
      .physics-panel h2 span { display: none; }
      .physics-panel .panel-controls { gap: 9px 14px; }
      .physics-panel .control-set { flex-wrap: wrap; }
      #wind { width: 105px; }
      .hud-tip { max-width: calc(100% - 20px); font-size: 11px; }
    }
    @media (orientation: portrait) {
      #viewport { flex-direction: column; }
      #ref-pane { border-left: 0; border-top: 1px solid #2a2e37; }
    }
    .hud-tip {
      position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.45); padding: 5px 10px; border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>
  <header aria-label="뷰어 컨트롤">
    <div class="masthead">
      <h1>Agent Family <span>Rig-C Viewer · @rig-c/play</span></h1>
      <label class="scene-control"><span>캐릭터</span>
        <select id="charSelect">
          <option value="all5" selected>패밀리 전원 · 5인 밀착 합체</option>
          <option value="all5_wide">패밀리 전원 · 원본 크롭 간격</option>
          <option value="roa">1번 · 로아 (Roa)</option>
          <option value="luna">2번 · 루나 (Luna)</option>
          <option value="jinni">3번 · 지니 (Jinni)</option>
          <option value="naru">4번 · 나루 (Naru)</option>
          <option value="nova">5번 · 노바 (Nova)</option>
          <option value="composed">로아 + 루나 · 어깨동무 2인</option>
        </select>
      </label>
      <label class="scene-control"><span>의상 대상</span>
        <select id="outfitTargetSelect" aria-label="의상 대상">
          <option value="all" selected>전원 (현재 화면)</option>
          <option value="roa">1번 · 로아 (Roa)</option>
          <option value="luna">2번 · 루나 (Luna)</option>
          <option value="jinni">3번 · 지니 (Jinni)</option>
          <option value="naru">4번 · 나루 (Naru)</option>
          <option value="nova">5번 · 노바 (Nova)</option>
        </select>
      </label>
      <label class="scene-control"><span>의상</span>
        <select id="outfitSelect" aria-label="의상">
          <option value="office">오피스</option>
          <option value="homewear">홈웨어</option>
          <option value="swimwear">수영복</option>
        </select>
      </label>
      <div id="stats" role="status">로딩 중…</div>
      <button id="resetBtn" title="저장된 보기와 물리 설정을 기본값으로 되돌립니다">설정 초기화</button>
    </div>

    <div class="toolbar-groups">
      <section class="tool-panel" aria-labelledby="playback-heading">
        <h2 id="playback-heading">재생</h2>
        <div class="panel-controls">
          <button id="pauseBtn">일시정지</button>
          <label>속도 <input id="speed" type="range" min="0.1" max="2.5" step="0.1" value="1.0" />
            <span id="speedVal" class="value">1.0×</span>
          </label>
        </div>
      </section>

      <section class="tool-panel" aria-labelledby="view-heading">
        <h2 id="view-heading">보기</h2>
        <div class="panel-controls view-controls">
          <button id="refBtn" class="on" aria-pressed="true">원화 비교</button>
          <div class="control-set" role="group" aria-label="확대">
            <span class="control-name">확대</span>
            <button data-zoom="fit">맞춤</button>
            <button data-zoom="1.5">1.5×</button>
            <button data-zoom="2.5">2.5×</button>
            <button data-zoom="4">4× 상반신</button>
          </div>
          <div class="control-set background-controls" role="group" aria-label="배경">
            <span class="control-name">배경</span>
            <button data-bg="dark" class="on">다크</button>
            <button data-bg="white">화이트</button>
            <button data-bg="grey">회색</button>
            <button data-bg="magenta" title="메시와 파츠 사이의 틈을 확인하는 자홍 배경">자홍</button>
          </div>
        </div>
      </section>

      <section class="tool-panel" aria-labelledby="diagnostics-heading">
        <h2 id="diagnostics-heading">진단</h2>
        <div class="panel-controls diagnostic-controls">
          <button id="bonesBtn" aria-pressed="false">뼈</button>
          <button id="meshBtn" aria-pressed="false">메시</button>
          <button id="bustBtn" aria-pressed="false" title="가슴 물리 구(bust_r / bust_l) 위치와 반지름을 마우스로 직접 찝어서 편집합니다">가슴 영역</button>
          <label>메시 농도 <input id="meshOpacity" type="range" min="0" max="1" step="0.05" value="0.55" /></label>
        </div>
      </section>

      <section class="tool-panel physics-panel" aria-labelledby="physics-heading" title="바람과 돌풍은 재생 속도에 맞춰 진행하며 일시정지하면 멈춥니다">
        <h2 id="physics-heading">물리 <span>치마 · 헤어 · 가슴</span></h2>
        <div class="panel-controls">
          <div class="control-set" role="group" aria-label="기본 환경">
            <label>기본 바람 <input id="wind" type="range" min="-100" max="100" step="0.1" value="0" />
              <span id="windVal" class="value">0.0</span>
            </label>
            <span class="wind-readout">현재 <output id="windCurrent" class="value" aria-label="현재 적용 바람">0.0</output></span>
            <label>중력 <input id="gravity" type="range" min="-3" max="3" step="0.1" value="0" />
              <span id="gravVal" class="value">0.0</span>
            </label>
          </div>
          <div class="control-set" role="group" aria-label="물리 동작">
            <button id="gustBtn" aria-pressed="false" title="기본 바람에 사인파 산들바람을 더합니다">산들바람</button>
            <button id="joltBtn" title="캐릭터에 순간 관성 충격 주기">찰랑이기</button>
          </div>
          <div class="control-set" role="group" aria-label="돌풍 설정과 실행">
            <label>돌풍 세기 <input id="gustPeak" type="number" min="0" max="200" step="1" value="48" /></label>
            <label>시간 <input id="gustDuration" type="number" min="0.1" max="20" step="0.1" value="2.4" />초</label>
            <button id="pulseBtn" title="선택한 세기의 돌풍을 기본 바람에 더합니다. 시작할 때 기본 바람 방향을 따르며 0이면 오른쪽. 진행 중인 돌풍의 설정은 유지됩니다">돌풍</button>
            <button id="repeatGustBtn" aria-pressed="false" title="돌풍 시작 간격은 6초와 돌풍 시간+0.6초 중 큰 값입니다. 진행 중인 돌풍을 이어받으며, 끄면 진행 중 돌풍은 끝까지 재생합니다">돌풍 반복</button>
          </div>
        </div>
      </section>
    </div>

    <div id="bustEditorBar" role="region" aria-label="가슴 영역 편집기">
      <label>대상
        <select id="bustCharSelect">
          <option value="roa">로아 (Roa)</option>
          <option value="luna">루나 (Luna)</option>
          <option value="jinni" selected>지니 (Jinni)</option>
          <option value="naru">나루 (Naru)</option>
          <option value="nova">노바 (Nova)</option>
        </select>
      </label>
      <div class="bust-group">
        <span class="bust-tag-r">● 우(R)</span>
        <label>X <input id="bustRX" type="number" step="1" value="384" /></label>
        <label>Y <input id="bustRY" type="number" step="1" value="724" /></label>
        <label>R <input id="bustRR" type="number" min="6" max="120" step="1" value="24" /></label>
        <label>Band <input id="bustRB" type="number" min="4" max="120" step="1" value="38" /></label>
      </div>
      <div class="bust-group">
        <span class="bust-tag-l">● 좌(L)</span>
        <label>X <input id="bustLX" type="number" step="1" value="514" /></label>
        <label>Y <input id="bustLY" type="number" step="1" value="720" /></label>
        <label>R <input id="bustLR" type="number" min="6" max="120" step="1" value="25" /></label>
        <label>Band <input id="bustLB" type="number" min="4" max="120" step="1" value="39" /></label>
      </div>
      <div class="bust-group">
        <button id="bustSymBtn" title="우측(R)의 Y 높이·반지름(R)·밴드(Band)를 좌측(L)에 똑같이 맞춥니다">Y·크기 대칭</button>
        <button id="bustApplyBtn" title="현재 가슴 영역 좌표를 저장하고 즉시 리그를 재빌드해 화면에 반영합니다">적용 · 리빌드</button>
        <button id="bustCopyBtn" title="현재 캐릭터의 가슴 영역 JSON을 클립보드에 복사합니다">JSON 복사</button>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="stage" class="bg-dark">
      <canvas id="overlay" aria-label="현재 포즈의 뼈와 메시 오버레이"></canvas>
      <div class="hud-tip">드래그: 이동 + 물리 관성 (가슴 영역 ON 시: 원 중심=위치 이동, 실선 우측점=코어 R, 점선 상단점=Band 조절)</div>
    </div>
    <div id="ref-pane" class="show bg-dark">
      <div id="refCaption" class="cap">원본 일러스트 (painting.png)</div>
      <img id="refImg" src="/docs_family_5chars_recomposite.png" alt="원본" />
      <canvas id="refOverlay" aria-label="원화 비교 가슴 영역 오버레이"></canvas>
    </div>
  </div>

  <script type="module">
    import { l as loadModel, R as RigPlayer } from '/viewer/assets/player.js';
    import { createSceneLoader } from '/viewer/load-lifecycle.mjs';
    import { createWindControls, BASE_WIND_LIMIT, MAX_GUST_PEAK, MIN_GUST_DURATION, MAX_GUST_DURATION } from '/viewer/wind-controls.mjs';
    import { readViewState, writeViewState, defaultViewState } from '/viewer/view-state.mjs';
    import { fitCamera, cameraScale, worldToPanel, zoomAt, referenceFrame } from '/viewer/viewport.mjs';
    import { drawOverlay } from '/viewer/debug-overlay.mjs?v=3';
    import { outfitAssets, ownAssets } from '/viewer/outfits.mjs';
    import { createOutfitTransaction } from '/viewer/outfit-transaction.mjs';

    const CHARACTER_LABELS = { roa: '로아', luna: '루나', jinni: '지니', naru: '나루', nova: '노바' };
    const stage = document.getElementById('stage');
    const stats = document.getElementById('stats');
    const charSelect = document.getElementById('charSelect');
    const outfitTargetSelect = document.getElementById('outfitTargetSelect');
    const outfitSelect = document.getElementById('outfitSelect');
    let outfitTarget = outfitTargetSelect.value || 'naru';
    const refCaption = document.getElementById('refCaption');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedInput = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');
    const windInput = document.getElementById('wind');
    const windVal = document.getElementById('windVal');
    const windCurrent = document.getElementById('windCurrent');
    const gravInput = document.getElementById('gravity');
    const gravVal = document.getElementById('gravVal');
    const gustBtn = document.getElementById('gustBtn');
    const pulseBtn = document.getElementById('pulseBtn');
    const repeatGustBtn = document.getElementById('repeatGustBtn');
    const joltBtn = document.getElementById('joltBtn');
    const refBtn = document.getElementById('refBtn');
    const refPane = document.getElementById('ref-pane');
    const refImg = document.getElementById('refImg');

    const gustPeakInput = document.getElementById('gustPeak');
    const gustDurationInput = document.getElementById('gustDuration');
    windInput.min = String(-BASE_WIND_LIMIT); windInput.max = String(BASE_WIND_LIMIT);
    gustPeakInput.max = String(MAX_GUST_PEAK);
    gustDurationInput.min = String(MIN_GUST_DURATION); gustDurationInput.max = String(MAX_GUST_DURATION);
    const overlay = document.getElementById('overlay');
    const refOverlay = document.getElementById('refOverlay');
    const bonesBtn = document.getElementById('bonesBtn');
    const meshBtn = document.getElementById('meshBtn');
    const bustBtn = document.getElementById('bustBtn');
    const bustEditorBar = document.getElementById('bustEditorBar');
    const bustCharSelect = document.getElementById('bustCharSelect');
    const bustRX = document.getElementById('bustRX');
    const bustRY = document.getElementById('bustRY');
    const bustRR = document.getElementById('bustRR');
    const bustRB = document.getElementById('bustRB');
    const bustLX = document.getElementById('bustLX');
    const bustLY = document.getElementById('bustLY');
    const bustLR = document.getElementById('bustLR');
    const bustLB = document.getElementById('bustLB');
    const bustSymBtn = document.getElementById('bustSymBtn');
    const bustApplyBtn = document.getElementById('bustApplyBtn');
    const bustCopyBtn = document.getElementById('bustCopyBtn');
    const meshOpacity = document.getElementById('meshOpacity');
    let storage;
    try { storage = globalThis.localStorage; } catch { storage = null; }
    let ui = readViewState(storage);
    let camera = null;
    const boneSpecs = new WeakMap();
    const assetOwners = new WeakMap();
    let sceneVersion = 0;
    let players = [];
    let container = null;
    let box = null;
    let scale = 1;
    let paused = ui.paused;
    let speed = ui.speed;
    let bustEdit = false;
    let activeBustChar = 'jinni';
    function makeCharBust(chest, r, l) {
      const clone = () => ({ bust_r: { ...r }, bust_l: { ...l } });
      return { chest, outfits: { office: clone(), homewear: clone(), swimwear: clone() } };
    }
    let bustData = {
      roa: makeCharBust([360, 657], { cx: 296, cy: 650, r: 26, band: 42 }, { cx: 438, cy: 650, r: 28, band: 44 }),

    function createBlinkState() {
      return {
        cooldown: 0.5 + Math.random() * 2.8,
        elapsed: -1,
        duration: 0.24,
        doubleLeft: 0,
        closeAmount: 0,
      };
    }

    function stepBlinkState(st, dt) {
      if (st.elapsed >= 0) {
        st.elapsed += dt;
        const u = st.elapsed / st.duration;
        if (u >= 1) {
          st.elapsed = -1;
          st.closeAmount = 0;
          if (st.doubleLeft > 0) {
            st.doubleLeft--;
            st.cooldown = 0.09 + Math.random() * 0.06;
          } else {
            st.doubleLeft = Math.random() < 0.20 ? 1 : 0;
            st.cooldown = 2.0 + Math.random() * 3.8;
          }
        } else if (u < 0.30) {
          const t = u / 0.30;
          st.closeAmount = t * t * (3 - 2 * t);
        } else if (u < 0.46) {
          st.closeAmount = 1.0;
        } else {
          const t = (u - 0.46) / 0.54;
          st.closeAmount = 1.0 - t * t * (3 - 2 * t);
        }
      } else {
        st.cooldown -= dt;
        if (st.cooldown <= 0) {
          st.elapsed = 0;
          st.duration = 0.21 + Math.random() * 0.06;
        }
      }
    }

    function createRigEntry([key, offsetX = 0, phaseOffset = 0, offsetY = 0, zIndex = 1], assets, target) {
      const sub = target.appendChild(document.createElement('div'));
      sub.style.cssText = `position: absolute; left: ${offsetX}px; top: ${offsetY}px; z-index: ${zIndex};`;

      const blink = createBlinkState();
      const player = new RigPlayer(sub, assets, {
        adjust(pose) {
          const names = pose.names;
          if (!names.includes('eye_r') || !names.includes('eye_l')) return;
          const sy = 1.0 - blink.closeAmount * 0.88;
          const by = -blink.closeAmount * 1.2;
          const er = pose.bone('eye_r');
          const el = pose.bone('eye_l');
          er.scaleY = (er.setup.scaleY ?? 1) * sy;
          el.scaleY = (el.setup.scaleY ?? 1) * sy;
          if (names.includes('brow_r')) {
            const br = pose.bone('brow_r');
            br.y = (br.setup.y ?? 0) + by;
          }
          if (names.includes('brow_l')) {
            const bl = pose.bone('brow_l');
            bl.y = (bl.setup.y ?? 0) + by;
          }
        },
      });
      try {
        const anim = assets.animations[0]?.name || 'idle';
        player.play(anim);
        if (phaseOffset > 0) player.frame(phaseOffset);
        player.frame(0);
        const b = assets.stage ?? player.bounds() ?? { x: -400, y: 0, width: 800, height: 2284 };
        return { key, player, sub, bounds: b, offsetX, offsetY, zIndex, anim, blink, assets,
          assetOwner: assetOwners.get(assets), outfit: assetOwners.get(assets)?.outfit ?? 'office', boneSpecs: boneSpecs.get(assets) ?? [] };
      } catch (error) {
        try { player.dispose(); } finally { sub.remove(); }
        throw error;
      }
    }

    async function loadRigAssets(key, outfit, bust) {
      let specs = [];
      const location = outfitAssets(key, outfit);
      const raw = await loadModel({
        modelUrl: `${location.modelUrl}?v=${bust}`,
        resolvePage(page, modelUrl) {
          return new URL(`${page}?v=${bust}`, new URL(modelUrl, document.baseURI)).href;
        },
        async fetch(...args) {
          const response = await fetch(...args);
          if (response.ok) specs = (await response.clone().json()).bones;
          return response;
        },
      });
      const owned = ownAssets(raw);
      owned.owner.outfit = outfit;
      assetOwners.set(owned.assets, owned.owner);
      boneSpecs.set(owned.assets, specs);
      return owned.assets;
    }

    function updateReference(key, bust = Date.now()) {
      const single = players.length === 1 ? players[0].key : (CHARACTER_LABELS[key] ? key : null);

    const outfitTransaction = createOutfitTransaction({
      current: request => request.sceneVersion === sceneVersion && players.includes(request.entry),
      async load(request) {
        const { entry, key, outfit } = request;
        const assets = await loadRigAssets(key, outfit, Date.now());
        try {
          if (!assets.stage || ['x', 'y', 'width', 'height'].some(k => assets.stage[k] !== entry.bounds[k])) throw new Error(`${CHARACTER_LABELS[key] ?? key} 의상 stage 좌표가 현재 리그와 다릅니다`);
          return createRigEntry([key, entry.offsetX, 0, entry.offsetY, entry.zIndex], assets, document.createElement('div'));
        } catch (error) { assets.dispose(); throw error; }
      },
      commit({ entry, key, outfit }, candidate) {
        // Read the live phase only when the candidate is ready. Public seek replays
        // physics; this transfers animation phase, not the old physics state.
        const track = entry.player.entry(0);
        const animation = track?.animation ?? entry.anim;
        if (!candidate.assets.animations.some(a => a.name === animation)) throw new Error(`의상 리그에 애니메이션 ${animation}이 없습니다`);
        Object.assign(candidate.blink, entry.blink);
        candidate.player.play(animation, { loop: track?.loop ?? true });
        const { wind } = windControls.read();
        candidate.player.environment({ wind: [wind, 0], gravity: [0, Number(gravInput.value)] });
        if (track) candidate.player.seek(track.animationTime);
        candidate.anim = animation;
        const old = { player: entry.player, sub: entry.sub, assets: entry.assetOwner.current };
        const owner = entry.assetOwner;
        container.appendChild(candidate.sub);
        candidate.player.renderer.syncPixelRatio();
        candidate.player.frame(0);

        Object.assign(entry, candidate, { assetOwner: owner });

        stats.textContent = `${ui.character} · ${CHARACTER_LABELS[key] ?? key} ${OUTFIT_LABELS[outfit] ?? outfit} · physics ON`;
        // The original scene-loader record still owns this stable entry and owner.
        for (const release of [() => old.player.dispose(), () => old.assets.dispose(), () => old.sub.remove()]) {

      },
    });

    function hitBustHandle(pane, clientX, clientY) {
      if (!bustEdit || !camera || !(scale > 0)) return null;
      const rect = pane.getBoundingClientRect?.();
      if (!rect) return null;
      const mx = clientX - rect.left, my = clientY - rect.top;
      const size = panelSize(pane);
      const staticPose = pane === refPane;
      for (const entry of players) {
        const chData = bustData[entry.key];
        if (!chData) continue;
        const outfit = entry.outfit ?? 'office';
        const regs = chData.outfits?.[outfit] ?? chData.outfits?.swimwear ?? chData.outfits?.office;
        if (!regs || !regs.bust_r || !regs.bust_l) continue;
        let poseDx = 0, poseDy = 0;
        if (!staticPose && entry.player?.bone && Array.isArray(chData.chest)) {
          try {
            const chest = entry.player.bone('chest');
            if (chest && chest.active) {
              poseDx = chest.x - (chData.chest[0] - 400);
              poseDy = chest.y - (2284 - chData.chest[1]);
            }
          } catch {}
        }
        for (const side of ['bust_r', 'bust_l']) {
          const reg = regs[side];
          const wx = (reg.cx - 400) + poseDx + (entry.offsetX ?? 0);
          const wy = (2284 - reg.cy) + poseDy - (entry.offsetY ?? 0);
          const center = worldToPanel(wx, wy, camera, scale, size);
          const pxR = Math.max(2, reg.r * scale);
          const pxBand = Math.max(pxR + 2, (reg.r + reg.band) * scale);
          const distRHandle = Math.hypot(mx - (center.x + pxR), my - center.y);
          const distBandHandle = Math.hypot(mx - center.x, my - (center.y - pxBand));
          const distCenter = Math.hypot(mx - center.x, my - center.y);
          if (distRHandle <= 10 || Math.abs(distCenter - pxR) <= 6) {
            return { mode: 'r', key: entry.key, reg, center, startX: clientX, startY: clientY, startReg: { ...reg } };
          }
          if (distBandHandle <= 10 || Math.abs(distCenter - pxBand) <= 6) {
            return { mode: 'band', key: entry.key, reg, center, startX: clientX, startY: clientY, startReg: { ...reg } };
          }
          if (distCenter <= Math.max(12, pxR)) {
            return { mode: 'move', key: entry.key, reg, center, startX: clientX, startY: clientY, startReg: { ...reg } };
          }
        }
      }
      return null;
    }

    // Both comparison surfaces share a world-space camera and cursor-anchored zoom.
    for (const pane of [stage, refPane]) {
      pane.addEventListener('wheel', e => {
        e.preventDefault();
        if (!container || !camera) return;
        const rect = pane.getBoundingClientRect();
        const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? pane.clientHeight : 1);
        camera = zoomAt(camera, scale, Math.exp(-delta * .002), { x: e.clientX - rect.left, y: e.clientY - rect.top }, panelSize(pane));
        updateViewport(); saveState();
      }, { passive: false });
      let held = null;
      let bustDrag = null;
      pane.addEventListener('pointerdown', e => {
        const hit = hitBustHandle(pane, e.clientX, e.clientY);
        if (hit) {
          bustDrag = hit;
          activeBustChar = hit.key;
          bustCharSelect.value = hit.key;
          syncBustEditorInputs();
          redrawOverlay();
          pane.setPointerCapture?.(e.pointerId);
          return;
        }
        held = { x:e.clientX, y:e.clientY };
        pane.setPointerCapture?.(e.pointerId);
      });
      pane.addEventListener('pointerup', () => { bustDrag = null; held = null; saveState(); });
      pane.addEventListener('pointercancel', () => { bustDrag = null; held = null; });
      pane.addEventListener('pointermove', e => {
        if (bustDrag && scale > 0) {
          const rect = pane.getBoundingClientRect?.();
          const mx = rect ? e.clientX - rect.left : 0;
          const my = rect ? e.clientY - rect.top : 0;
          if (bustDrag.mode === 'move') {
            bustDrag.reg.cx = Math.round(bustDrag.startReg.cx + (e.clientX - bustDrag.startX) / scale);
            bustDrag.reg.cy = Math.round(bustDrag.startReg.cy + (e.clientY - bustDrag.startY) / scale);
          } else if (bustDrag.mode === 'r') {
            const dWorld = Math.hypot(mx - bustDrag.center.x, my - bustDrag.center.y) / scale;
            bustDrag.reg.r = Math.max(6, Math.min(120, Math.round(dWorld)));
          } else if (bustDrag.mode === 'band') {
            const dWorld = Math.hypot(mx - bustDrag.center.x, my - bustDrag.center.y) / scale;
            bustDrag.reg.band = Math.max(4, Math.min(120, Math.round(dWorld - bustDrag.reg.r)));
          }
          syncBustEditorInputs();
          redrawOverlay();
          return;
        }
        if (!held || !camera || !container) return;
        const dx = e.clientX-held.x, dy = e.clientY-held.y;
        held = { x:e.clientX, y:e.clientY };
        camera.x -= dx/scale; camera.y += dy/scale;
        if (pane === stage) {
          const clampMove = (v, lim) => Math.max(-lim, Math.min(lim, v));
          const impulse = { x:clampMove(dx/scale*.25,8), y:clampMove(-dy/scale*.25,6) };
          for (const p of players) p.player.moved(impulse);
        }
        updateViewport();
      });
    }
    if (typeof ResizeObserver === 'function') {
      const observer = new ResizeObserver(updateViewport); observer.observe(stage); observer.observe(refPane);
    }

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.classList.toggle('on', paused);
      pauseBtn.textContent = paused ? '재생' : '일시정지';
    });

    speedInput.addEventListener('input', () => {
      speed = parseFloat(speedInput.value);
      speedVal.textContent = `${speed.toFixed(1)}×`;
    });

    windInput.addEventListener('input', () => {
      const w = parseFloat(windInput.value);
      windControls.setBase(w);
      windVal.textContent = w.toFixed(1);
      syncEnvironment();
    });

    gravInput.addEventListener('input', () => {
      const g = parseFloat(gravInput.value);
      gravVal.textContent = g.toFixed(1);
      syncEnvironment();
    });

    gustBtn.addEventListener('click', () => {
      const enabled = !windControls.read().breeze;
      windControls.setBreeze(enabled);
      gustBtn.classList.toggle('on', enabled);
      gustBtn.setAttribute('aria-pressed', String(enabled));
      syncEnvironment();
    });

    for (const [input, setter] of [[gustPeakInput, 'setGustPeak'], [gustDurationInput, 'setGustDuration']]) {
      const applyValue = () => {
        const value = Number(input.value);
        if (input.value.trim() && Number.isFinite(value) && value >= Number(input.min || 0) && value <= Number(input.max)) {
          windControls[setter](value); saveState();
        }
      };
      input.addEventListener('input', applyValue);
      input.addEventListener('change', () => { applyValue(); syncUi(); saveState(); });
    }

    pulseBtn.addEventListener('click', () => {
      windControls.triggerGust();
      syncEnvironment();
    });

    repeatGustBtn.addEventListener('click', () => {
      const enabled = !windControls.read().repeat;
      windControls.setRepeat(enabled);
      repeatGustBtn.classList.toggle('on', enabled);
      repeatGustBtn.setAttribute('aria-pressed', String(enabled));
      syncEnvironment();
    });

    joltBtn.addEventListener('click', () => {
      if (players.length === 0) return;
      for (const p of players) p.player.moved({ x: 18, y: -10 });
      setTimeout(() => {
        for (const p of players) p.player.moved({ x: -18, y: 10 });
      }, 90);
    });

    refBtn.addEventListener('click', () => {
      ui.comparison = !ui.comparison; syncUi(); updateViewport(); saveState();
    });
    bonesBtn.addEventListener('click', () => { ui.bones = !ui.bones; syncUi(); redrawOverlay(); saveState(); });
    meshBtn.addEventListener('click', () => { ui.mesh = !ui.mesh; syncUi(); redrawOverlay(); saveState(); });
    bustBtn.addEventListener('click', () => {
      bustEdit = !bustEdit;
      syncBustEditorInputs();
      syncUi();
      redrawOverlay();
    });
    bustCharSelect.addEventListener('change', () => {
      activeBustChar = bustCharSelect.value;
      const regs = activeBustRegions(activeBustChar);
      if (regs) {
        bustRX.value = String(Math.round(regs.bust_r.cx));
        bustRY.value = String(Math.round(regs.bust_r.cy));
        bustRR.value = String(Math.round(regs.bust_r.r));
        bustRB.value = String(Math.round(regs.bust_r.band));
        bustLX.value = String(Math.round(regs.bust_l.cx));
        bustLY.value = String(Math.round(regs.bust_l.cy));
        bustLR.value = String(Math.round(regs.bust_l.r));
        bustLB.value = String(Math.round(regs.bust_l.band));
      }
      redrawOverlay();
    });
    for (const [el, side, field] of [
      [bustRX, 'bust_r', 'cx'], [bustRY, 'bust_r', 'cy'], [bustRR, 'bust_r', 'r'], [bustRB, 'bust_r', 'band'],
      [bustLX, 'bust_l', 'cx'], [bustLY, 'bust_l', 'cy'], [bustLR, 'bust_l', 'r'], [bustLB, 'bust_l', 'band'],
    ]) {
      el.addEventListener('input', () => {
        const v = Number(el.value);
        const regs = activeBustRegions(activeBustChar);
        if (regs && Number.isFinite(v)) {
          regs[side][field] = Math.round(v);
          redrawOverlay();
        }
      });
    }
    bustSymBtn.addEventListener('click', () => {
      const regs = activeBustRegions(activeBustChar);
      if (!regs) return;
      regs.bust_l.cy = regs.bust_r.cy;
      regs.bust_l.r = regs.bust_r.r;
      regs.bust_l.band = regs.bust_r.band;
      syncBustEditorInputs();
      redrawOverlay();
    });
    bustApplyBtn.addEventListener('click', async () => {
      if (typeof globalThis.fetch !== 'function') return;
      const targetChar = bustCharSelect.value || activeBustChar;
      const currentOutfit = activeBustOutfit(targetChar);
      const regs = bustData[targetChar]?.outfits?.[currentOutfit] ?? activeBustRegions(targetChar);
      if (!regs) return;
      bustApplyBtn.disabled = true;
      bustApplyBtn.textContent = '리빌드 중…';
      stats.textContent = `${CHARACTER_LABELS[targetChar] ?? targetChar} 전 의상(오피스·홈웨어·수영복) 가슴 영역 리빌드 중…`;
      try {
        const res = await globalThis.fetch('/api/bust-regions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ character: targetChar, outfit: currentOutfit, bust_r: regs.bust_r, bust_l: regs.bust_l }),
        });
        const out = await res.json();
        if (!res.ok || !out.ok) throw new Error(out.error || `HTTP ${res.status}`);
        if (bustData[targetChar]?.outfits) {
          for (const o of ['office', 'homewear', 'swimwear']) {
            bustData[targetChar].outfits[o] = { bust_r: { ...out.bust_r }, bust_l: { ...out.bust_l } };
          }
        }
        syncBustEditorInputs();
        const entry = players.find(p => p.key === targetChar);
        if (entry) {
          await outfitTransaction.open({ key: targetChar, outfit: currentOutfit, entry, sceneVersion });
          setTimeout(() => {
            const refreshed = players.find(p => p.key === targetChar);
            refreshed?.player?.moved({ x: 14, y: -10 });
            setTimeout(() => refreshed?.player?.moved({ x: -14, y: 10 }), 90);
          }, 60);
        }
        stats.textContent = `${CHARACTER_LABELS[targetChar] ?? targetChar} 전 의상(오피스·홈웨어·수영복) 가슴 영역 리빌드 완료! R(${out.bust_r.cx},${out.bust_r.cy},r=${out.bust_r.r},b=${out.bust_r.band}) · L(${out.bust_l.cx},${out.bust_l.cy},r=${out.bust_l.r},b=${out.bust_l.band})`;
      } catch (err) {
        stats.textContent = `가슴 영역 리빌드 실패: ${err.message}`;
        console.error(err);
      } finally {
        bustApplyBtn.disabled = false;
        bustApplyBtn.textContent = '적용 · 리빌드';
        redrawOverlay();
      }
    });
    bustCopyBtn.addEventListener('click', () => {
      const targetChar = bustCharSelect.value || activeBustChar;
      const regs = activeBustRegions(targetChar);
      if (!regs) return;
      const text = JSON.stringify({ character: targetChar, outfit: activeBustOutfit(targetChar), bust_r: regs.bust_r, bust_l: regs.bust_l }, null, 2);
      globalThis.navigator?.clipboard?.writeText(text);
      stats.textContent = `${CHARACTER_LABELS[targetChar] ?? targetChar} 가슴 영역 JSON 복사됨: ${text.replace(/\s+/g, ' ')}`;
    });
    meshOpacity.addEventListener('input', () => { ui.meshOpacity = Number(meshOpacity.value); redrawOverlay(); saveState(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      ui = defaultViewState(); camera = null; outfitTarget = 'naru';
      windControls.restore?.(null);
      if (!windControls.restore) { windControls.setBase(0); windControls.setBreeze(false); windControls.setRepeat(false); }
      syncUi(); saveState(); openCharacter(ui.character);
    });
    charSelect.addEventListener('change', () => { camera = null; ui.character = charSelect.value; syncBustEditorInputs(); saveState(); openCharacter(charSelect.value); });
    outfitTargetSelect.addEventListener('change', () => { outfitTarget = outfitTargetSelect.value; syncOutfitUi(); syncBustEditorInputs(); redrawOverlay(); });
    outfitSelect.addEventListener('change', () => { openOutfit(outfitSelect.value, outfitTargetSelect.value); });
    // Persist stable control settings on changes and when leaving; reload begins a fresh physics run.
    for (const element of [pauseBtn, speedInput, windInput, gravInput, gustBtn, pulseBtn, repeatGustBtn]) {
      element.addEventListener(element === speedInput || element === windInput || element === gravInput ? 'input' : 'click', saveState);
    }
    globalThis.addEventListener?.('pagehide', saveState);
    document.addEventListener?.('visibilitychange', () => { if (document.hidden) saveState(); });
    refImg.addEventListener('load', updateViewport);
    globalThis.addEventListener?.('resize', updateViewport);

    let last = performance.now();
    requestAnimationFrame(function tick(now) {
      const dt = Math.min((now - last) / 1000, 1 / 15);
      last = now;
      if (players.length > 0 && !paused) {
        windControls.advance(dt * speed);
        syncEnvironment();
        for (const p of players) {
          if (p.blink) stepBlinkState(p.blink, dt * speed);
          p.player.frame(dt * speed);
        }
      }
      redrawOverlay();
      requestAnimationFrame(tick);
    });

    openCharacter(ui.character);
  </script>
</body>
</html>
